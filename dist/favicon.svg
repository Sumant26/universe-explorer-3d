<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background cosmic gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0a1a" />
      <stop offset="50%" stop-color="#1f1133" />
      <stop offset="100%" stop-color="#34164c" />
    </linearGradient>

    <!-- Warm Cabin Glow -->
    <radialGradient id="cabinGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#ffe4a0" />
      <stop offset="70%" stop-color="#ff9d3b" />
      <stop offset="100%" stop-color="#d95204" />
    </radialGradient>

    <!-- Subtle Ambient Nebula Glow -->
    <radialGradient id="nebulaGlow" cx="65%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#e066ff" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#ff9944" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#120c24" stop-opacity="0" />
    </radialGradient>

    <!-- Planet Gradient -->
    <linearGradient id="planetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb870" />
      <stop offset="100%" stop-color="#c84b85" />
    </linearGradient>

    <!-- Ship Hull Metallic Gold/Bronze -->
    <linearGradient id="hullGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe2b8" />
      <stop offset="40%" stop-color="#cfa375" />
      <stop offset="100%" stop-color="#5a4232" />
    </linearGradient>

    <!-- Thruster Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#7df9ff" />
      <stop offset="80%" stop-color="#ffaa44" />
      <stop offset="100%" stop-color="#ff4400" stop-opacity="0" />
    </linearGradient>

    <!-- Outer Badge Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffca85" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#c77dff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ff9248" stop-opacity="0.5" />
    </linearGradient>

    <!-- Drop Shadow for Ship -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Icon Background (Squircle) -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Ambient Nebula -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#nebulaGlow)" />

  <!-- Distant Stars & Constellation Specks -->
  <circle cx="14" cy="15" r="0.9" fill="#ffffff" opacity="0.8" />
  <circle cx="22" cy="11" r="0.6" fill="#ffd8a8" opacity="0.6" />
  <circle cx="10" cy="38" r="0.7" fill="#ffffff" opacity="0.5" />
  <circle cx="53" cy="46" r="0.8" fill="#ffd8a8" opacity="0.7" />
  <circle cx="48" cy="54" r="0.6" fill="#ffffff" opacity="0.5" />

  <!-- Distant Ringed Planet (Upper Right) -->
  <g transform="translate(47, 16)">
    <!-- Behind Planet Ring segment -->
    <path d="M -9 1.5 A 9 3 25 0 1 7 -2" stroke="#e8a4d0" stroke-width="1" fill="none" opacity="0.5" />
    <!-- Planet body -->
    <circle cx="0" cy="0" r="4.5" fill="url(#planetGrad)" />
    <!-- In-front Planet Ring segment -->
    <path d="M 7 -2 A 9 3 25 0 1 -9 1.5" stroke="#ffe0b2" stroke-width="1.2" fill="none" opacity="0.9" />
  </g>

  <!-- Big Twinkling 4-Point Star -->
  <path d="M 17 24 Q 17 27 14 27 Q 17 27 17 30 Q 17 27 20 27 Q 17 27 17 24 Z" fill="#ffffff" opacity="0.9" />

  <!-- Cozy Space Cabin / Explorer Craft -->
  <g transform="translate(0, 2)" filter="url(#softGlow)">
    <!-- Thruster Flame / Cozy Plasma Trail -->
    <path d="M 28 47 Q 32 58 32 60 Q 32 58 36 47 Z" fill="url(#flameGrad)" />

    <!-- Ship Wing / Stabilizer pods -->
    <!-- Left wing -->
    <path d="M 22 37 C 16 39 15 44 18 47 C 22 47 25 45 26 42 Z" fill="#2d1d42" stroke="url(#hullGrad)" stroke-width="1" />
    <circle cx="18" cy="44" r="1.2" fill="#ffb066" />

    <!-- Right wing -->
    <path d="M 42 37 C 48 39 49 44 46 47 C 42 47 39 45 38 42 Z" fill="#2d1d42" stroke="url(#hullGrad)" stroke-width="1" />
    <circle cx="46" cy="44" r="1.2" fill="#ffb066" />

    <!-- Main Cabin Pod Hull -->
    <path d="M 32 14 C 23 14 20 26 21 41 C 21 44 24 46 32 46 C 40 46 43 44 43 41 C 44 26 41 14 32 14 Z" 
          fill="#1c142b" 
          stroke="url(#hullGrad)" 
          stroke-width="1.5" />

    <!-- Nose Beacon Light -->
    <circle cx="32" cy="13.5" r="1.5" fill="#ffe0a3" />

    <!-- Cozy Warm Porthole / Cabin Window (The Hearth of the Ship) -->
    <circle cx="32" cy="29" r="8" fill="#130c1e" stroke="url(#hullGrad)" stroke-width="1.2" />
    <circle cx="32" cy="29" r="6.5" fill="url(#cabinGlow)" />

    <!-- Porthole Window Reflection / Glass Highlight -->
    <path d="M 28 25 A 5 5 0 0 1 35 24" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.85" />
    <circle cx="34.5" cy="30.5" r="0.8" fill="#ffffff" opacity="0.75" />

    <!-- Lower Cabin Detail / Trim -->
    <path d="M 27 40 Q 32 42 37 40" stroke="#cfa375" stroke-width="1" fill="none" opacity="0.8" />
  </g>
</svg>
